name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: choretracker
          POSTGRES_USER: choretracker
          POSTGRES_PASSWORD: choretracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choretracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/choretracker
      SPRING_DATASOURCE_USERNAME: choretracker
      SPRING_DATASOURCE_PASSWORD: choretracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build
