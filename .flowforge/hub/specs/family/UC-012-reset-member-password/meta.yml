id: UC-012
name: reset-member-password
slug: reset-member-password
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to set a new password for another family member without knowing the old one, so that nobody is locked out of the family for good.
preconditions:
  - The caller is logged in as an active parent.
  - The target is another family member, active or deactivated.
postconditions:
  - The target member's password is replaced by the new password's hash.
  - All sessions of the target member are ended.
  - Any lockout and failed-attempt count on the target member's username is cleared.
  - The caller's own sessions are unaffected.
  - Each ended session is removed and a session end record is written with the member, the session's start time, the end time and reason password-reset.
status: draft
version: 1.0.0
priority: P1
related_screens:
