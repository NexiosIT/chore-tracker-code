# =============================================================================
# API Contract — UC-003-log-in
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Log in"
  version: "1.0.0"

paths:
  /api/sessions:
    post:
      operationId: logIn
      summary: Start a session for a family member who gives a matching username and password.
      description: >-
        Anonymous. The username matches in any case. The returned token is sent as
        `Authorization: Bearer <token>` on later calls. Each successful login starts a new
        session, so a member can be logged in on several devices.
      tags:
        - family
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInRequest"
      responses:
        "201":
          description: Session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStarted"
        "400":
          description: Username or password is missing (code VALIDATION_FAILED). Not counted as a failed attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: Some fields need attention.
                details:
                  - field: username
                    rule: required
                    message: Enter your username
        "401":
          description: >-
            Unknown username or wrong password (code AUTHENTICATION_FAILED). Counted as a failed
            attempt for the submitted username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHENTICATION_FAILED
                message: Username or password incorrect
        "403":
          description: >-
            The password matches, but the account cannot log in. Codes
            AUTHORIZATION_REGISTRATION_PENDING, AUTHORIZATION_REGISTRATION_REJECTED and
            AUTHORIZATION_ACCOUNT_DEACTIVATED. Not counted as a failed attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHORIZATION_REGISTRATION_PENDING
                message: A parent has not approved your account yet.
        "429":
          description: >-
            The submitted username is locked after 5 consecutive failures (code
            RATE_LIMIT_LOGIN_LOCKED). `retryAt` tells when to try again.
          headers:
            Retry-After:
              description: Seconds until the lockout ends.
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: RATE_LIMIT_LOGIN_LOCKED
                message: Too many failed attempts. Try again later.
                retryAt: "2026-11-23T14:32:00Z"

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    LogInRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Login name in any case. Only checked for presence, so no rule is revealed.
          example: jip_2015
        password:
          type: string
          format: password
          description: Never returned or logged.
          example: voetbal2015

    SessionStarted:
      type: object
      required:
        - token
        - member
      properties:
        token:
          type: string
          description: >-
            Opaque session token. Sent as `Authorization: Bearer <token>`. Valid until logout or
            until a password change, a password reset or a deactivation ends the session.
          example: 3q2+7w8kQe0f5mB1yZr9xA
        member:
          $ref: "#/components/schemas/Member"

    Member:
      type: object
      required:
        - id
        - username
        - displayName
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 7d1c6b2e-4f8a-4c3e-9b1a-2f5d8e6a9c01
        username:
          type: string
          description: Login name as typed at creation.
          example: Sanne_V
        displayName:
          type: string
          example: Mama
        role:
          type: string
          enum:
            - parent
            - kid
          example: parent
        status:
          type: string
          enum:
            - active
            - deactivated
          example: active

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
