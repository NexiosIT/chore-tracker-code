id: UC-003
name: log-in
slug: log-in
domain: family
service: chore-tracker-api
actor: Family member (parent or kid) who is not logged in on this device
goal: As a family member, I want to log in with my username and password and stay logged in on my phone, so that I don't have to type them every time.
preconditions:
  - The family exists.
  - The caller is not logged in on this device.
postconditions:
  - On success, a new session for the member exists and its token is returned; the member's other sessions are unaffected.
  - On success, the failed-attempt count for the submitted username is reset to zero.
  - A failure with an unknown username or a wrong password adds one to the failed-attempt count of the submitted username, ignoring case.
