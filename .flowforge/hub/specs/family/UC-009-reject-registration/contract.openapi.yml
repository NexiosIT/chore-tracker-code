# =============================================================================
# API Contract — UC-009-reject-registration
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Reject registration"
  version: "1.0.0"

paths:
  /api/registrations/{registrationId}/reject:
    post:
      operationId: rejectRegistration
      summary: Reject a pending kid registration; it is kept on record and its username is freed.
      tags:
        - family
      security:
        - sessionToken: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Id of the registration to decide.
          schema:
            type: string
            format: uuid
            example: 2b9e4c1a-6d3f-4a8b-9c2e-5f1d7a3b8e40
      responses:
        "200":
          description: Registration rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          description: >-
            No session token, or the session has ended through logout, a password change, a password
            reset or a deactivation (code AUTHENTICATION_REQUIRED). The app shows the Login screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHENTICATION_REQUIRED
                message: Your session has ended. Log in again.
        "403":
          description: The caller is a kid, not a parent (code AUTHORIZATION_PARENT_ONLY).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHORIZATION_PARENT_ONLY
                message: Only a parent can do this.
        "404":
          description: No registration has this id (code NOT_FOUND_REGISTRATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND_REGISTRATION
                message: That registration does not exist.
        "409":
          description: >-
            The registration is no longer pending. Code CONFLICT_REGISTRATION_ALREADY_APPROVED or
            CONFLICT_REGISTRATION_ALREADY_REJECTED tells which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: CONFLICT_REGISTRATION_ALREADY_APPROVED
                message: This registration was already approved.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    Registration:
      type: object
      required:
        - id
        - username
        - displayName
        - status
        - requestedAt
      properties:
        id:
          type: string
          format: uuid
          example: 2b9e4c1a-6d3f-4a8b-9c2e-5f1d7a3b8e40
        username:
          type: string
          description: Requested login name as typed.
          example: Roos_K
        displayName:
          type: string
          example: Roos
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          example: pending
        requestedAt:
          type: string
          format: date-time
          example: "2026-11-23T16:05:00Z"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
