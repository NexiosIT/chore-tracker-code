id: UC-010
name: add-parent
slug: add-parent
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to create an account for my partner, so that they can manage chores and approvals too.
preconditions:
  - The caller is logged in as an active parent.
postconditions:
  - An active family member with the parent role exists with the submitted username (as typed), display name and a hashed initial password, with no approval step.
  - The new parent appears in the members list as an active parent.
  - The new parent can log in with the initial password.
  - The caller's own session is unaffected and no session is started for the new parent.
