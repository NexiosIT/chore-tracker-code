id: UC-008
name: approve-registration
slug: approve-registration
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to approve a kid's pending registration, so that my kid can log in and join the family.
preconditions:
  - The caller is logged in as an active parent.
  - The registration exists and is pending.
postconditions:
  - An active family member with the kid role exists with the registration's username, display name and password hash.
  - The registration is marked approved and is no longer in the pending list.
  - The kid can log in with the password chosen at registration.
  - The registration records the deciding parent, the decision time and the id of the member it created.
