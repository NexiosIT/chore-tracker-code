id: UC-005
name: get-current-member
slug: get-current-member
domain: family
service: chore-tracker-api
actor: Logged-in family member (parent or kid)
goal: As a logged-in family member's app, I want to know whose session this is, so that I show the right role's screens after a restart and send an ended session to the Login screen.
preconditions:
  - The caller sends a session token.
postconditions:
  - The response returns the member the session belongs to, with id, username, display name, role and status.
  - Nothing is changed.
