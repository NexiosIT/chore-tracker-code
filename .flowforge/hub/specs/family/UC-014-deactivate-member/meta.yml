id: UC-014
name: deactivate-member
slug: deactivate-member
domain: family
service: chore-tracker-api
actor: Parent
goal: As a parent, I want to deactivate a family member's account, so that I control who can use the family space without losing anyone's history.
preconditions:
  - The caller is logged in as an active parent.
  - The target member is active.
  - After the deactivation at least one active parent remains.
postconditions:
  - The member's status is deactivated and none of their data is deleted.
  - All sessions of the member are ended, so their next action on any device shows the Login screen.
  - The member stays in the members list with status deactivated.
  - Each ended session is removed and a session end record is written with the member, the session's start time, the end time and reason deactivation.
status: draft
version: 1.0.0
priority: P1
