id: UC-001
name: found-family
slug: found-family
domain: family
service: chore-tracker-api
actor: Founding parent (anonymous, fresh install)
goal: As the first parent on a fresh install, I want to create my account and the family in one step, so that I can start bringing in the rest of the family.
preconditions:
  - No family exists yet, which means no family member of any role or status exists.
  - The caller is not logged in.
postconditions:
  - The family exists.
  - One active family member with the parent role exists, with the submitted username (stored as typed), display name and a hashed password.
  - A session exists for that parent and its token is returned to the caller.
  - A refused setup creates no family member and no session.
