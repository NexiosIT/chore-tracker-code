id: SCR-008
name: Change password
slug: change-password
app: chore-tracker
domain: family
route: /account/password
status: draft
version: 1.0.0
description: A family member changes their own password by giving the current one; their other devices are logged out.
sections:
  - name: change-password-form
    use_case_ref: specs/family/UC-011-change-own-password
    aspect: form
    load_trigger: page-load
    component_tree:
      component:
        name: ChangePasswordForm
        type: form
        tokens:
          padding: spacing-lg
          gap: spacing-md
          background: color-surface
        children:
          - name: ChangePasswordTitle
            type: heading
            tokens:
              color: color-text
            props:
              text: Change password
          - name: CurrentPasswordField
            type: form-field
            tokens:
              border: color-border
              radius: radius-card
            props:
              field: currentPassword
              label: Current password
              input: password
          - name: NewPasswordField
            type: form-field
            tokens:
              border: color-border
              radius: radius-card
            props:
              field: newPassword
              label: New password
              input: password
              helper: At least 8 characters. Your other devices are logged out.
          - name: FieldErrors
            type: inline
            tokens:
              gap: spacing-sm
            props:
              variant: error
              source: error.details
          - name: SaveButton
            type: button
            tokens:
              padding: spacing-md
            props:
              variant: primary
              label: Change password
              submits: true
orchestration:
  - source: change-password-form
    on_success:
      - target: null
        action: notify
        params:
          type: toast
          variant: success
          message: Password changed. Your other devices are logged out.
          duration_ms: 3000
      - target: null
        action: navigate
        params:
          route: /home
    on_error:
      - target: change-password-form
        action: notify
        params:
          type: inline
          variant: error
          message: Some fields need attention.
responsive:
  - breakpoint: mobile
    changes:
      - section: change-password-form
        action: stack
  - breakpoint: tablet
    changes:
      - section: change-password-form
        action: stack
