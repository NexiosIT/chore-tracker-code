# =============================================================================
# API Contract — UC-010-add-parent
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Add parent"
  version: "1.0.0"

paths:
  /api/members/parents:
    post:
      operationId: addParent
      summary: Create another parent account, active immediately.
      tags:
        - family
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParentRequest"
      responses:
        "201":
          description: Parent created and active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: One or more input rules are broken (code VALIDATION_FAILED). Every broken rule is listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: Some fields need attention.
                details:
                  - field: username
                    rule: length
                    message: Username needs 3 to 20 characters
        "401":
          description: >-
            No session token, or the session has ended through logout, a password change, a password
            reset or a deactivation (code AUTHENTICATION_REQUIRED). The app shows the Login screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHENTICATION_REQUIRED
                message: Your session has ended. Log in again.
        "403":
          description: The caller is a kid, not a parent (code AUTHORIZATION_PARENT_ONLY).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHORIZATION_PARENT_ONLY
                message: Only a parent can do this.
        "409":
          description: >-
            The username is used by a family member or a pending registration, ignoring case
            (code CONFLICT_USERNAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: CONFLICT_USERNAME_TAKEN
                message: That username is taken. Choose another one.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    AddParentRequest:
      type: object
      required:
        - username
        - displayName
        - password
      properties:
        username:
          type: string
          description: 3 to 20 letters, digits or underscores; unique ignoring case. Checked by the service so every broken rule is reported.
          example: Joris_V
        displayName:
          type: string
          description: 1 to 30 characters after leading and trailing spaces are removed.
          example: Papa
        password:
          type: string
          format: password
          description: Initial password, 8 to 64 characters. Never returned or logged.
          example: regenboog77

    Member:
      type: object
      required:
        - id
        - username
        - displayName
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 7d1c6b2e-4f8a-4c3e-9b1a-2f5d8e6a9c01
        username:
          type: string
          description: Login name as typed at creation.
          example: Sanne_V
        displayName:
          type: string
          example: Mama
        role:
          type: string
          enum:
            - parent
            - kid
          example: parent
        status:
          type: string
          enum:
            - active
            - deactivated
          example: active

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
