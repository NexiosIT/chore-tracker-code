# =============================================================================
# API Contract — UC-011-change-own-password
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Change own password"
  version: "1.0.0"

paths:
  /api/members/me/password:
    put:
      operationId: changeOwnPassword
      summary: Replace the caller's password after checking the current one.
      description: Keeps the session used for the call and ends the caller's other sessions.
      tags:
        - family
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "204":
          description: Password changed. No body.
        "400":
          description: >-
            The current password is wrong or the new password breaks a rule (code
            VALIDATION_FAILED). Every broken rule is listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: Some fields need attention.
                details:
                  - field: currentPassword
                    rule: matches
                    message: Your current password is incorrect
        "401":
          description: >-
            No session token, or the session has ended through logout, a password change, a password
            reset or a deactivation (code AUTHENTICATION_REQUIRED). The app shows the Login screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHENTICATION_REQUIRED
                message: Your session has ended. Log in again.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    ChangeOwnPasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: The caller's present password. Never returned or logged.
          example: voetbal2015
        newPassword:
          type: string
          format: password
          description: 8 to 64 characters, no composition rules. Never returned or logged.
          example: keeper2026

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
