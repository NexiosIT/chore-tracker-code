# =============================================================================
# API Contract — UC-012-reset-member-password
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Reset member password"
  version: "1.0.0"

paths:
  /api/members/{memberId}/password:
    put:
      operationId: resetMemberPassword
      summary: A parent sets a new password for another member, ending their sessions and clearing their lockout.
      tags:
        - family
      security:
        - sessionToken: []
      parameters:
        - name: memberId
          in: path
          required: true
          description: Id of the family member to act on.
          schema:
            type: string
            format: uuid
            example: 4e2a9c7b-1d5f-4b3a-8c6e-9a0b2d4f6e81
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetMemberPasswordRequest"
      responses:
        "204":
          description: Password reset. No body.
        "400":
          description: The new password breaks a rule (code VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: Some fields need attention.
                details:
                  - field: newPassword
                    rule: minLength
                    message: Password needs at least 8 characters
        "401":
          description: >-
            No session token, or the session has ended through logout, a password change, a password
            reset or a deactivation (code AUTHENTICATION_REQUIRED). The app shows the Login screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHENTICATION_REQUIRED
                message: Your session has ended. Log in again.
        "403":
          description: The caller is a kid, not a parent (code AUTHORIZATION_PARENT_ONLY).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AUTHORIZATION_PARENT_ONLY
                message: Only a parent can do this.
        "404":
          description: No family member has this id (code NOT_FOUND_MEMBER).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND_MEMBER
                message: That family member does not exist.
        "422":
          description: The target is the caller (code BUSINESS_RESET_OWN_PASSWORD); change password is for that.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BUSINESS_RESET_OWN_PASSWORD
                message: Use Change password to change your own password.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    ResetMemberPasswordRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          format: password
          description: 8 to 64 characters, no composition rules. Never returned or logged.
          example: nieuwjaar2027

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
