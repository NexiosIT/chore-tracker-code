# =============================================================================
# API Contract — UC-002-get-family-status
# =============================================================================
# Conformance convention:
# - Schemas describe the UNWRAPPED body, in **camelCase**:
#     success response → the `data` payload   ·   error response → the `error` body.
#   The `{ data, error, meta }` envelope (STD-001) and the snake_case wire
#   representation (STD-010) are applied UNIFORMLY by the service — do NOT
#   model the envelope or snake_case here.
# - Code-to-contract conformance (STD-024) unwraps the envelope and validates
#   the body against these schemas, projecting camelCase → snake_case on the
#   schema (oracle) side. Author every field in camelCase.
# - Shared schemas (Member, SessionStarted, Error) are defined identically in
#   every family contract that uses them.
# =============================================================================

openapi: "3.0.3"
info:
  title: "Get family status"
  version: "1.0.0"

paths:
  /api/family/status:
    get:
      operationId: getFamilyStatus
      summary: Tell whether the family exists, so the app can offer Setup or Login.
      description: Anonymous. A session token, valid or not, is ignored.
      tags:
        - family
      security: []
      responses:
        "200":
          description: Family status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStatus"
        "500":
          description: Unexpected failure (code INTERNAL_ERROR). No internal detail is exposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INTERNAL_ERROR
                message: Something went wrong. Try again later.

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Opaque session token returned by found-family or log-in.
  schemas:
    FamilyStatus:
      type: object
      required:
        - familyExists
      properties:
        familyExists:
          type: boolean
          description: True once any family member exists, whatever its role or status.
          example: true

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002).
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable message, safe to display to end users.
          example: Some fields need attention.
        retryAt:
          type: string
          format: date-time
          description: When a locked-out username may try again (only with code RATE_LIMIT_LOGIN_LOCKED).
          example: "2026-11-23T14:32:00Z"
        details:
          type: array
          description: Field-level validation errors (HTTP 400 — STD-001 Rule 8).
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: username
              rule:
                type: string
                example: length
              message:
                type: string
                example: Username needs 3 to 20 characters
